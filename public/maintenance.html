<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - hehe.cx</title>
    <link rel="icon" type="image/png" href="/src/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd700;
            --purple: #8b5cf6;
            --yellow: #eab308;
            --red: #ef4444;
            --bg-dark: #0a0a0f;
            --text: #f5f5f7;
            --text-muted: #71717a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at top, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(255, 215, 0, 0.1) 0%, transparent 50%);
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 32px;
        }

        .icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px auto;
            display: block;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text);
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 100px;
            font-size: 0.95rem;
            color: var(--purple);
            transition: all 0.3s ease;
        }

        .status.full-maintenance {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--red);
        }

        .status.full-maintenance .status-dot {
            background: var(--red);
        }

        .status.view-only {
            background: rgba(234, 179, 8, 0.1);
            border-color: rgba(234, 179, 8, 0.3);
            color: var(--yellow);
        }

        .status.view-only .status-dot {
            background: var(--yellow);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--purple);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        .admin-link {
            margin-top: 48px;
            font-size: 0.85rem;
        }

        .admin-link a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .admin-link a:hover {
            color: var(--purple);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/src/logo.png" alt="hehe.cx" class="icon">
        <h1 id="mainTitle">Come back later...</h1>
        <div class="status" id="statusBadge">
            <div class="status-dot"></div>
            <span id="statusText">Under maintenance</span>
        </div>
        <p class="subtitle" id="subtitle"></p>
    </div>

    <script>
        // Fetch maintenance status and update UI accordingly
        fetch('/api/maintenance/status')
            .then(res => res.json())
            .then(data => {
                const statusBadge = document.getElementById('statusBadge');
                const statusText = document.getElementById('statusText');
                const mainTitle = document.getElementById('mainTitle');
                const subtitle = document.getElementById('subtitle');

                if (data.maintenance_mode) {
                    // Full maintenance mode
                    statusBadge.classList.add('full-maintenance');
                    statusText.textContent = 'Full maintenance';
                    mainTitle.textContent = 'Come back later...';
                } else if (data.view_only_maintenance_mode) {
                    // View-only maintenance mode
                    statusBadge.classList.add('view-only');
                    statusText.textContent = 'View-only mode';
                    mainTitle.textContent = 'Limited access';
                    subtitle.textContent = 'You can still view user profiles during maintenance.';
                    subtitle.style.display = 'block';
                } else {
                    // Not in maintenance - redirect to home
                    window.location.href = '/';
                }
            })
            .catch(err => {
                console.error('Error fetching maintenance status:', err);
            });
    </script>
</body>
</html>
